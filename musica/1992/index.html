<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="1992 — EP de Amor Fundido."
  />

  <title>1992 — Amor Fundido — Nada Punto Com</title>

  <link rel="stylesheet" href="/style.css" />
</head>

<body>

  <header class="site-header">

    <a class="brand" href="/">
      NADA PUNTO COM
    </a>

    <nav class="main-nav">

      <a href="/archivo/">
        /archivo
      </a>

      <a href="/merch/">
        /merch
      </a>

      <a href="/proyectos/">
        /proyectos
      </a>

      <a href="/info/">
        /info
      </a>

    </nav>

  </header>


  <main>

    <article class="entry-page">


      <!-- CABECERA -->

      <header class="entry-header">

        <div>

          <span class="entry-number">
            004
          </span>

          <h1>
            1992
          </h1>

        </div>


        <div class="entry-meta">

          <span>
            AMOR FUNDIDO
          </span>

          <span>
            EP / 2026
          </span>

        </div>

      </header>


      <!-- RELEASE -->

      <div class="release">


        <!-- PORTADA -->

        <div class="release-cover">

          <img
            src="/1992-cover.jpg"
            alt="1992 — Amor Fundido"
          />

        </div>


        <!-- INFO + TRACKLIST -->

        <div class="release-info">

          <p class="release-artist">
            AMOR FUNDIDO
          </p>


          <div class="release-meta">

            <span>
              EP
            </span>

            <span>
              2026
            </span>

            <span>
              4 TRACKS
            </span>

          </div>


          <div class="tracklist">


            <!-- 01 -->

            <div class="track-row">

              <span class="track-number">
                01
              </span>

              <span class="track-title">
                VERACRUZ
              </span>

              <button
                class="track-play"
                type="button"
                data-audio="track-01"
              >
                PLAY
              </button>

              <audio
                id="track-01"
                src="/1992-01-veracruz.mp3"
                preload="metadata"
              ></audio>

            </div>


            <!-- 02 -->

            <div class="track-row">

              <span class="track-number">
                02
              </span>

              <span class="track-title">
                VIEJO
              </span>

              <button
                class="track-play"
                type="button"
                data-audio="track-02"
              >
                PLAY
              </button>

              <audio
                id="track-02"
                src="/1992-02-viejo.mp3"
                preload="metadata"
              ></audio>

            </div>


            <!-- 03 -->

            <div class="track-row">

              <span class="track-number">
                03
              </span>

              <span class="track-title">
                GORDO PANZÓN
              </span>

              <button
                class="track-play"
                type="button"
                data-audio="track-03"
              >
                PLAY
              </button>

              <audio
                id="track-03"
                src="/1992-03-gordo-panzon.mp3"
                preload="metadata"
              ></audio>

            </div>


            <!-- 04 -->

            <div class="track-row">

              <span class="track-number">
                04
              </span>

              <span class="track-title">
                CABALLO
              </span>

              <button
                class="track-play"
                type="button"
                data-audio="track-04"
              >
                PLAY
              </button>

              <audio
                id="track-04"
                src="/1992-04-caballo.mp3"
                preload="metadata"
              ></audio>

            </div>


          </div>

        </div>


      </div>


      <!-- NAVEGACIÓN -->

      <nav class="entry-navigation">

        <a href="/merch/tee-01/">
          ← ANTERIOR
        </a>

        <a href="/archivo/">
          ARCHIVO →
        </a>

      </nav>


    </article>

  </main>


  <footer>

    <span>
      NADA PUNTO COM
    </span>

    <span>
      004
    </span>

  </footer>


  <script src="/script.js"></script>
