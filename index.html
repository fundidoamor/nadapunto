<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Nada Punto Com — archivo de gráfica, objetos, imágenes, música, personas y otras cosas."
  />

  <title>Nada Punto Com</title>

  <link rel="stylesheet" href="/style.css" />
</head>


<body>

  <!-- ========================================
       HEADER
  ========================================= -->

  <header class="site-header">

    <a class="brand" href="/">
      NADA PUNTO COM
    </a>

    <nav
      class="main-nav"
      aria-label="Navegación principal"
    >

      <a href="/archivo/">
        /archivo
      </a>

      <a href="/merch/">
        /merch
      </a>

      <a href="/proyectos/">
        /proyectos
      </a>

      <a href="/info/">
        /info
      </a>

    </nav>

  </header>


  <!-- ========================================
       MAIN
  ========================================= -->

  <main>


    <!-- ========================================
         HERO
    ========================================= -->

    <section class="hero">

      <div class="hero-copy">

        <p class="eyebrow">
          archivo / objetos / imágenes / música / personas
        </p>

        <h1>
          NADA<br>
          PUNTO<br>
          COM
        </h1>

      </div>


      <div class="hero-meta">

        <span>
          MX
        </span>

        <span>
          2026
        </span>

      </div>

    </section>


    <!-- ========================================
         ÍNDICE
    ========================================= -->

    <section
      class="index-section"
      aria-labelledby="indice-title"
    >

      <div class="section-heading">

        <h2 id="indice-title">
          ÍNDICE
        </h2>

        <span>
          001—004
        </span>

      </div>


      <div class="project-list">


        <!-- ========================================
             001
        ========================================= -->

        <a
          class="project-row"
          href="/archivo/trazo-tras-trazo-01/"
          data-preview="preview-1"
        >

          <span class="project-number">
            001
          </span>

          <span class="project-title">
            TRAZO TRAS TRAZO 01
          </span>

          <span class="project-type">
            proceso / video
          </span>

        </a>


        <!-- ========================================
             002
        ========================================= -->

        <a
          class="project-row"
          href="/archivo/grafica-01/"
          data-preview="preview-2"
        >

          <span class="project-number">
            002
          </span>

          <span class="project-title">
            GRÁFICA 01
          </span>

          <span class="project-type">
            ilustración
          </span>

        </a>


        <!-- ========================================
             003
        ========================================= -->

        <a
          class="project-row"
          href="/merch/tee-01/"
          data-preview="preview-3"
        >

          <span class="project-number">
            003
          </span>

          <span class="project-title">
            TEE 01
          </span>

          <span class="project-type">
            merch
          </span>

        </a>


        <!-- ========================================
             004
        ========================================= -->

        <a
          class="project-row"
          href="/musica/1992/"
          data-preview="preview-4"
        >

          <span class="project-number">
            004
          </span>

          <span class="project-title">
            1992
          </span>

          <span class="project-type">
            música / EP
          </span>

        </a>

      </div>


      <!-- ========================================
           PREVIEWS
      ========================================= -->

      <div
        class="preview-panel"
        aria-hidden="true"
      >


        <!-- 001 — TRAZO TRAS TRAZO -->

        <div
          class="preview-placeholder preview-media"
          id="preview-1"
        >

          <video
            class="preview-video"
            src="/trazo-tras-trazo-01.mp4"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
          ></video>

        </div>


        <!-- 002 — GRÁFICA 01 -->

        <div
          class="preview-placeholder preview-media preview-light"
          id="preview-2"
        >

          <img
            class="preview-image preview-contain"
            src="/grafica-01-mujer-tigre.jpeg"
            alt=""
          />

        </div>


        <!-- 003 — TEE 01 -->

        <div
          class="preview-placeholder preview-media"
          id="preview-3"
        >

          <img
            class="preview-image"
            src="/merch-tee-01.png"
            alt=""
          />

        </div>


        <!-- 004 — 1992 -->

        <div
          class="preview-placeholder preview-media"
          id="preview-4"
        >

          <img
            class="preview-image"
            src="/1992-cover.jpg"
            alt=""
          />

        </div>


      </div>

    </section>

  </main>


  <!-- ========================================
       FOOTER
  ========================================= -->

  <footer>

    <span>
      NADA PUNTO COM
    </span>

    <span>
      2026
    </span>

  </footer>


  <script src="/script.js"></script>

</body>

</html>
